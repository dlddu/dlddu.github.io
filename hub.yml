# 허브 페이지 수동 목록. 자동 수집(GitHub API)에 더해지고, 같은 이름이면 여기 값이 우선한다.
#
# services: 운영 중인 서비스. url 필수.
#   - name: my-service
#     url: https://my-service.dlddu.dev
#     repo: my-service          # 선택. 적으면 "GitHub 레포 →" 링크와 설명이 붙는다
#     description: 한 줄 설명    # 선택. 없으면 레포 About 설명
#
# pages: GitHub Pages. private 레포처럼 자동 수집에 안 잡히는 것.
#   - repo: some-private-repo   # url 을 안 적으면 https://dlddu.dev/<repo>/
#     private: true
#
# repos: Pages 가 없어도 자주 쓰는 레포. 레포 이름만 적어도 된다.
#   - infrastructure

# 주소 출처: flux-cd-apps 의 IngressRoute (PUBLIC_DOMAIN = llkm.nl).
# 루트(/)가 404인 API 전용 서비스(pocket-aide, dear-baby)와 내부망(mklm.nl)은 넣지 않았다.
services:
  - name: session-platform
    url: https://session-platform.llkm.nl
    repo: session-platform
  - name: feature-doc
    url: https://feature-doc.llkm.nl
    repo: feature-doc
  - name: econ-monitor
    url: https://econ-monitor.llkm.nl
    repo: economic-opinion-trend-monitor
  - name: drop
    url: https://drop.llkm.nl
    repo: drop
  - name: meal-appointment
    url: https://meal-appointment.llkm.nl
    repo: meal-appointment-v2
  - name: homelab-k3s-mcp
    url: https://homelab-k3s-mcp.llkm.nl
    repo: homelab-k3s-mcp
    description: MCP 엔드포인트

pages:
  - repo: plugin-marketplace
    private: true

repos:
  - infrastructure
  - flux-cd
  - flux-cd-apps
